  # -------------------  COURSES  -------------------
  /courses:
    get:
      summary: Get all courses with optional status filter
      tags: [Courses]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, pending, pre-register]
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Course'
                    - type: object
                      properties:
                        teacherName: { type: string }
                        studentCount: { type: integer }
                        chapters:
                          type: array
                          items:
                            type: object
                            properties:
                              videos:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    videoUrl: { type: string, format: uri }
        '500': { $ref: '#/components/responses/ServerError' }
    #-----------------
    post:
      summary: Create a new course (Admin only) – Only coverImage uploaded
      tags: [Courses, Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                coverImage:
                  type: string
                  format: binary
                  description: Course cover image (required)
                description: 
                  type: string
                  example: "توضیحات دوره جامع react"
                title:
                  type: string
                  example: "دوره جامع React"
                category:
                  type: string
                  example: "68c7d1fef7b0c1ac54f81867"
                teacher:
                  type: string
                  example: "68c714e997d61d7fad8c1469"
                status:
                  type: string
                  enum: [active, pending, pre-register]
                  example: active
                level:
                  type: string
                  enum: [beginner, intermediate, advanced]
                  example: beginner
                duration:
                  type: integer
                  example: 1200
                presentationMethod:
                  type: string
                  enum: [streaming, download]
                  example: streaming
                type:
                  type: string
                  enum: [free, vip, paid]
                  example: paid
                price:
                  type: integer
                  example: 5000000
                discount:
                  type: integer
                  example: 10
                discountHours:
                  type: integer
                  example: 24
                discountMinutes:
                  type: integer
                  example: 0
                discountSeconds:
                  type: integer
                  example: 0
                previewVideoUrl:
                  type: string
                  format: uri
                  example: "https://youtube.com/preview123"
                # === فصل اول ===
                chapters[0].title:
                  type: string
                  example: "فصل اول - مقدمات"
                chapters[0].description:
                  type: string
                  example: "آشنایی با مفاهیم اولیه"
                chapters[0].duration:
                  type: integer
                  example: 600
                # ویدیو 1 فصل اول
                chapters[0].videos[0].title:
                  type: string
                  example: "مقدمه React"
                chapters[0].videos[0].description:
                  type: string
                  example: "معرفی فریم‌ورک"
                chapters[0].videos[0].duration:
                  type: integer
                  example: 20
                chapters[0].videos[0].videoUrl:
                  type: string
                  format: uri
                  example: "https://cdn.example.com/video1.mp4"
                # ویدیو 2 فصل اول
                chapters[0].videos[1].title:
                  type: string
                  example: "نصب Node.js"
                chapters[0].videos[1].description:
                  type: string
                  example: "راه‌اندازی محیط"
                chapters[0].videos[1].duration:
                  type: integer
                  example: 15
                chapters[0].videos[1].videoUrl:
                  type: string
                  format: uri
                  example: "https://cdn.example.com/video2.mp4"
                # === فصل دوم ===
                chapters[1].title:
                  type: string
                  example: "فصل دوم - کامپوننت‌ها"
                chapters[1].description:
                  type: string
                  example: "ساخت کامپوننت‌های کاربردی"
                chapters[1].duration:
                  type: integer
                  example: 600
                # ویدیو 1 فصل دوم
                chapters[1].videos[0].title:
                  type: string
                  example: "Class Components"
                chapters[1].videos[0].description:
                  type: string
                  example: "کامپوننت‌های کلاسی"
                chapters[1].videos[0].duration:
                  type: integer
                  example: 25
                chapters[1].videos[0].videoUrl:
                  type: string
                  format: uri
                  example: "https://cdn.example.com/video3.mp4"
              required:
                - coverImage
                - title
                - category
                - teacher
                - status
                - level
                - duration
                - presentationMethod
                - type
                - chapters[0].title
                - chapters[0].duration
                - chapters[0].videos[0].title
                - chapters[0].videos[0].duration
                - chapters[0].videos[0].videoUrl
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    #---------------
  /courses/{id}:
    put:
      summary: Update course (Admin only)
      tags: [Courses, Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                coverImage: { type: string, format: binary }
                title: { type: string }
                description: {type: string}
                category: { type: string }
                teacher: { type: string }
                status: { type: string }
                level: { type: string }
                duration: { type: integer }
                presentationMethod: { type: string }
                type: { type: string }
                price: { type: integer }
                discount: { type: integer }
                discountHours: { type: integer }
                discountMinutes: { type: integer }
                discountSeconds: { type: integer }
                previewVideoUrl: { type: string, format: uri }
                chapters[0].title: { type: string }
                chapters[0].videos[0].videoUrl: { type: string, format: uri }
      responses:
        '200': { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: Delete course
      tags: [Courses, Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Course and cover image deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /course/{courseId}/detail:
    get:
      summary: Get detailed course with access control
      tags: [Courses]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Full course detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  userProfile: { $ref: '#/components/schemas/User' }
                  notifications: { $ref: '#/components/schemas/NotificationsResponse' }
                  basket:
                    type: object
                    properties:
                      itemCount: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            courseId: { type: string }
                            title: { type: string }
                            price: { type: number }
                            discount: { type: number }
                            finalPrice: { type: number }
                      subscriptionPlan: { type: object, nullable: true }
                  course:
                    allOf:
                      - $ref: '#/components/schemas/Course'
                      - type: object
                        properties:
                          teacherName: { type: string }
                          isEnrolled: { type: boolean }
                          canAccess: { type: boolean }
                          chapters:
                            type: array
                            items:
                              type: object
                              properties:
                                videos:
                                  type: array
                                  items: { $ref: '#/components/schemas/VideoAccessInfo' }
                  teacher:
                    type: object
                    properties:
                      _id: { type: string }
                      fullName: { type: string }
                      expertise: { type: string }
                      bio: { type: string }
                      rating: { type: number }
                  relatedCourses:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        title: { type: string }
                        coverImage: { type: string, format: uri }
                        finalPrice: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ------------------- COURSE SEARCH (AUTOCOMPLETE) -------------------
  /courses/search:
    get:
      summary: Course search & autocomplete
      description: |
        Returns up to 5 active courses matching the query on **title**, **teacher**, or **category**.
        Each result includes **full course data** (same as detail page) for direct navigation.
      tags: [Courses]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
            minLength: 2
          required: true
          description: Search term (min 2 chars)
          example: react
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    maxItems: 5
                    items:
                      $ref: '#/components/schemas/SearchSuggestion'
                required: [suggestions]
        '400':
          description: Query too short
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

