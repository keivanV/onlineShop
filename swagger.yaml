              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments:
    post:
      summary: Create a payment for a course
      tags: [Payments]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId: { type: string }
                discountCode: { type: string }
              required: [courseId]
      responses:
        '200':
          description: Payment created or enrolled without payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  paymentUrl: { type: string }
                  authority: { type: string }
                  paymentId: { type: string }
                  originalPrice: { type: number }
                  courseDiscountPercent: { type: number }
                  courseDiscountAmount: { type: number }
                  codeDiscountPercent: { type: number }
                  codeDiscountAmount: { type: number }
                  finalPrice: { type: number }
                  paymentRequired: { type: boolean }
        '400':
          description: Bad request (e.g., already enrolled, invalid discount code)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Course or user not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /payments/verify:
    get:
      summary: Verify a payment
      tags: [Payments]
      parameters:
        - in: query
          name: paymentId
          schema:
            type: string
          required: true
        - in: query
          name: refId
          schema:
            type: string
          required: true
        - in: query
          name: status
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Payment verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  refId: { type: string }
                  courseId: { type: string }
                  subscriptionPlanId: { type: string }
                  subscriptionExpiresAt: { type: string, format: date-time }
        '400':
          description: Payment failed or already processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Payment not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /homepage:
    get:
      summary: Get homepage data with statistics and paginated courses
      tags: [Homepage]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            default: 3
          description: Number of courses per page
        - in: query
          name: status
          schema:
            type: string
            enum: ['active', 'pending', 'pre-register']
          description: Filter courses by status
        - in: query
          name: category
          schema:
            type: string
          description: Filter courses by category ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistics:
                    type: object
                    properties:
                      totalCourses:
                        type: integer
                      completedCourses:
                        type: integer
                      ongoingCourses:
                        type: integer
                      totalStudents:
                        type: integer
                      latestCourseTime:
                        type: string
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        coverImage:
                          type: string
                        teacher:
                          type: string
                        expertise:
                          type: string
                        price:
                          type: number
                        status:
                          type: string
                        level:
                          type: string
                        duration:
                          type: number
                        type:
                          type: string
                        category:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                  pagination:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCourses:
                        type: integer
                      limit:
                        type: integer
                  canCreateCourse:
                    type: boolean
        '500':
          description: Server error
  /basket:
    get:
      summary: Get user's shopping cart
      tags: [Basket]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        courseId:
                          type: string
                        title:
                          type: string
                        originalPrice:
                          type: number
                        courseDiscountPercent:
                          type: number
                        courseDiscountAmount:
                          type: number
                        codeDiscountAmount:
                          type: number
                        finalPrice:
                          type: number
                        discountCode:
                          type: string
                          nullable: true
                  subscriptionPlan:
                    type: object
                    nullable: true
                    properties:
                      subscriptionPlanId:
                        type: string
                      duration:
                        type: string
                      price:
                        type: number
                  totalPrice:
                    type: number
        '500':
          description: Server error
    post:
      summary: Add item to shopping cart
      tags: [Basket]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId:
                  type: string
                  description: ID of the course to add (optional if subscriptionPlanId is provided)
                subscriptionPlanId:
                  type: string
                  description: ID of the subscription plan to add (optional if courseId is provided)
                discountCode:
                  type: string
                  description: Discount code for the course (optional)
              oneOf:
                - required: [courseId]
                - required: [subscriptionPlanId]
      responses:
        '200':
          description: Item added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  basket:
                    type: object
        '400':
          description: Invalid input or item already in basket
        '404':
          description: Course, subscription plan, or discount code not found
        '500':
          description: Server error
    delete:
      summary: Remove item from shopping cart
      tags: [Basket]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId:
                  type: string
                  description: ID of the course to remove (optional if subscriptionPlanId is provided)
                subscriptionPlanId:
                  type: string
                  description: ID of the subscription plan to remove (optional if courseId is provided)
              oneOf:
                - required: [courseId]
                - required: [subscriptionPlanId]
      responses:
        '200':
          description: Item removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  basket:
                    type: object
        '400':
          description: Invalid input or item not in basket
        '404':
          description: Basket or item not found
        '500':
          description: Server error
  /basket/checkout:
    post:
      summary: Checkout all items in the shopping cart
      tags: [Basket]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Payment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  paymentUrl:
                    type: string
                  authority:
                    type: string
                  paymentId:
                    type: string
                  totalPrice:
                    type: number
                  paymentRequired:
                    type: boolean
        '400':
          description: Basket is empty or invalid items
        '404':
          description: User or basket not found
        '500':
          description: Server error
security:
  - BearerAuth: []
