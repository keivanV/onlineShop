  # -------------------  COURSES  -------------------
  /courses:
    get:
      summary: Get all courses with optional status filter
      tags: [Courses]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, pending, pre-register]
          description: Filter courses by status
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id: { type: string }
                    title: { type: string }
                    category: { type: object, properties: { name: { type: string } } }
                    teacher: { type: object, properties: { name: { type: string }, family: { type: string }, expertise: { type: string } } }
                    teacherName: { type: string }
                    studentCount: { type: integer }
                    expertise: { type: string }
                    status: { type: string, enum: [active, pending, pre-register] }
                    level: { type: string, enum: [beginner, intermediate, advanced] }
                    duration: { type: number }
                    type: { type: string, enum: [free, vip, paid] }
                    price: { type: number }
                    finalPrice: { type: number }
                    isDiscountActive: { type: boolean }
                    coverImage: { type: string, format: uri }
                    previewVideo: { type: string, format: uri, nullable: true }
                    chapters:
                      type: array
                      items:
                        type: object
                        properties:
                          title: { type: string }
                          duration: { type: number }
                          videos:
                            type: array
                            items:
                              type: object
                              properties:
                                title: { type: string }
                                fileUrl: { type: string, format: uri }
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Create a new course with multiple chapters and videos (Admin only)
      description: |
        **Upload multiple chapters and videos in one request.**
        
        - Use `chapters[0].title`, `chapters[0].videos[0].title`, `chapters[0].videos[0].file`
        - `i` and `j` start from **0**
        - You can add any number of chapters and videos
      tags: [Courses, Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                coverImage:
                  type: string
                  format: binary
                  description: Course cover image (required)
                previewVideo:
                  type: string
                  format: binary
                  description: Preview video (optional)
                title:
                  type: string
                  example: "دوره جامع React"
                category:
                  type: string
                  example: "507f1f77bcf86cd799439011"
                teacher:
                  type: string
                  example: "507f1f77bcf86cd799439013"
                status:
                  type: string
                  enum: [active, pending, pre-register]
                  example: active
                level:
                  type: string
                  enum: [beginner, intermediate, advanced]
                  example: intermediate
                duration:
                  type: integer
                  example: 480
                presentationMethod:
                  type: string
                  enum: [streaming, download]
                  example: streaming
                type:
                  type: string
                  enum: [free, vip, paid]
                  example: paid
                price:
                  type: integer
                  example: 350000
                discount:
                  type: integer
                  example: 20
                discountHours:
                  type: integer
                  example: 24
                discountMinutes:
                  type: integer
                  example: 0
                discountSeconds:
                  type: integer
                  example: 0

                # Dynamic Chapters & Videos
                chapters[0].title: { type: string }
                chapters[0].description: { type: string }
                chapters[0].duration: { type: integer }
                chapters[0].videos[0].title: { type: string }
                chapters[0].videos[0].description: { type: string }
                chapters[0].videos[0].duration: { type: integer }
                chapters[0].videos[0].file: { type: string, format: binary }

                chapters[0].videos[1].title: { type: string }
                chapters[0].videos[1].duration: { type: integer }
                chapters[0].videos[1].file: { type: string, format: binary }

                chapters[1].title: { type: string }
                chapters[1].description: { type: string }
                chapters[1].duration: { type: integer }
                chapters[1].videos[0].title: { type: string }
                chapters[1].videos[0].duration: { type: integer }
                chapters[1].videos[0].file: { type: string, format: binary }
                chapters[1].videos[1].title: { type: string }
                chapters[1].videos[1].duration: { type: integer }
                chapters[1].videos[1].file: { type: string, format: binary }




              required:
                - coverImage
                - title
                - category
                - teacher
                - status
                - level
                - duration
                - presentationMethod
                - type
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

          

  /courses/{id}:
