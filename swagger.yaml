openapi: 3.0.3
info:
  title: Education Platform API
  description: >-
    API for managing students, teachers, categories, courses, articles,
    discount codes, subscriptions and user dashboard **with OTP‑based
    authentication** (no password).  
    **Version 2.0.0** – completely password‑less flow.
  version: 2.0.0
servers:
  - url: http://localhost:5000/api
    description: Local server
tags:
  - name: Auth
    description: OTP‑based login / registration & token refresh
  - name: Users
    description: Operations for managing students and teachers
  - name: Categories
    description: Operations for managing course categories
  - name: Courses
    description: Operations for managing courses
  - name: Podcasts
    description: Podcast management with audio & cover upload
  - name: Notifications
    description: Push-style user notifications with read/unread tracking
  - name: Articles
    description: Operations for managing articles
  - name: Discounts
    description: Operations for managing discount codes
  - name: Subscriptions
    description: Operations for managing subscription plans
  - name: Payments
    description: Operations for managing payments
  - name: Basket
    description: Operations for managing the shopping cart
  - name: Homepage
    description: Operations for retrieving homepage data
  - name: Admin
    description: Operations restricted to admin users

    
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
      IdParam:
        name: id
        in: path
        required: true
        description: Unique identifier for the resource (24-character hex string)
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          example: 6901e9e92361fec7d871ebcb

      NotificationIdParam:
        name: notificationId
        in: path
        required: true
        description: Unique identifier for the notification
        schema:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'

  schemas:

    VideoAccessInfo:
      type: object
      properties:
        _id:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        duration:
          type: number
        time:
          type: string
          nullable: true
        fileUrl:
          type: string
          format: uri
          nullable: true
          description: Only available if user has access or it's the first video
        accessible:
          type: boolean
        message:
          type: string
          nullable: true
          description: Shown when video is locked
      required: [_id, title, duration, accessible]


    #--------------------------------------------------


    # -------------------------------------------------
    # USER (no password)
    # -------------------------------------------------
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        role: { type: string, enum: [student, teacher] }
        status: { type: string, enum: [active, ban] }
        subscription: { type: string, enum: [regular, vip] }
        subscriptionExpiresAt: { type: string, format: date-time }
        coursesEnrolled: { type: array, items: { type: string } }
        coursesTaught: { type: array, items: { type: string } }
        rating: { type: number }
        expertise: { type: string }
        nationalId: { type: string }
        bio: { type: string }
        lastLogin: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        isProfileComplete: { type: boolean }
      required: [name,  phone, email, isProfileComplete]

    Tokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
      required: [accessToken, refreshToken]

    OTPResponse:
      type: object
      properties:
        message: { type: string }
        requiresCompletion: { type: boolean }
      required: [message, requiresCompletion]

    VerifyOTPResponse:
      type: object
      properties:
        message: { type: string }
        requiresCompletion: { type: boolean }
        tempUserId: { type: string, nullable: true }
        accessToken: { type: string, nullable: true }
        refreshToken: { type: string, nullable: true }
      required: [message, requiresCompletion]

    Error:
      type: object
      properties:
        message: { type: string }
      required: [message]

    Category:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        description: { type: string }
        displayOrder: { type: number }
        courseCount: { type: number }
      required: [name, displayOrder]

    Comment:
      type: object
      properties:
        user: { type: string }
        text: { type: string }
        rating: { type: number, minimum: 0, maximum: 5 }
        status: { type: string, enum: [pending, approved], default: pending }
        createdAt: { type: string, format: date-time }
      required: [user, text, status]

    Course:
      type: object
      properties:
        courseRating:
          type: number
          example: 4.5
        courseRatingCount:
          type: integer
          example: 24
        _id: { type: string }
        coverImage: { type: string }
        description: 
          type: string
          example: "در این دوره با مفاهیم پایه تا پیشرفته React آشنا می‌شوید. شامل پروژه‌های واقعی، Hooks، Redux و..."
        title: { type: string }
        category: { type: string }
        teacher: { type: string }
        status: { type: string, enum: [active, pending, pre-register] }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        duration: { type: number }
        previewVideo: { type: string }
        presentationMethod: { type: string, enum: [download, streaming] }
        downloadLink: { type: string }
        prerequisites: { type: array, items: { type: string } }
        type: { type: string, enum: [free, vip, paid] }
        price: { type: number }
        discount: { type: number }
        chapters:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              duration: { type: number }
              description: { type: string }
              videos:
                type: array
                items:
                  type: object
                  properties:
                    title: { type: string }
                    description: { type: string }
                    duration: { type: number }
                    time: { type: string }
                    streamingLink: { type: string }
                  required: [title, duration]
            required: [title, duration]
        students: { type: array, items: { type: string } }
        rating: { type: number }
        expertise: { type: string }
        comments:
          type: array
          items: { $ref: '#/components/schemas/Comment' }
      required:
        - coverImage
        - title
        - category
        - teacher
        - status
        - level
        - duration
        - presentationMethod
        - type
    #-----------------------
    CreatePodcastRequest:
      type: object
      required: [title, duration, episode, audioUrl, coverImage]
      properties:
        title:
          type: string
          example: "JavaScript Fundamentals"
        description:
          type: string
          example: "Introduction to modern JavaScript concepts."
          nullable: true
        duration:
          type: integer
          example: 45
          description: Duration in minutes
        episode:
          type: integer
          example: 1
          description: Episode number
        tags:
          type: string
          example: "javascript,beginner"
          description: Comma-separated list of tags
        audioUrl:
          type: string
          format: uri
          example: "https://cdn.example.com/podcasts/ep1.mp3"
          description: External audio URL (http/https)
        coverImage:
          type: string
          format: binary
          description: Cover image file

    Podcast:
      allOf:
        - type: object
          properties:
            _id: { type: string }
            title: { type: string }
            description: { type: string, nullable: true }
            duration: { type: integer }
            episode: { type: integer }
            tags:
              type: array
              items: { type: string }
            audioUrl:
              type: string
              format: uri
              example: "https://cdn.example.com/podcasts/ep1.mp3"
            coverImage:
              type: string
              format: uri
              example: "http://localhost:5000/uploads/podcasts/cover/cover-123.jpg"
            author:
              type: object
              properties:
                _id: { type: string }
                name: { type: string }
                
            status:
              type: string
              enum: [draft, published]
              default: published
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
          required:
            - _id
            - title
            - duration
            - episode
            - audioUrl
            - coverImage
            - author
    Notification:
          type: object
          properties:
            _id: { type: string }
            user: { type: string }
            title: { type: string, example: "New Podcast!" }
            message: { type: string, example: "Episode 1 of JavaScript series is now live." }
            type: { type: string, enum: [course, podcast, system] }
            relatedId: { type: string }
            isRead: { type: boolean, default: false }
            createdAt: { type: string, format: date-time }
          required: [title, message, type]

    NotificationsResponse:
      type: object
      properties:
        notifications:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        unreadCount:
          type: integer
          example: 3

    # ================================
    # REUSABLE
    # ================================
    SuccessMessage:
      type: object
      properties:
        message: { type: string }

    Article:
      type: object
      properties:
        _id: { type: string }
        title: { type: string }
        shortDescription: { type: string }
        content: { type: string }
        featuredImage: { type: string }
        category: { type: string }
        tags: { type: array, items: { type: string } }
        readingTime: { type: number }
        status: { type: string, enum: [draft, published] }
      required: [title, shortDescription, content, featuredImage, category, readingTime, status]

    DiscountCode:
      type: object
      properties:
        _id: { type: string }
        code: { type: string }
        discountPercent: { type: number }
        maxUses: { type: number }
        usedCount: { type: number }
        isActive: { type: boolean }
        expiresAt: { type: string, format: date-time }
        usedBy:
          type: array
          items:
            type: object
            properties:
              user: { type: string }
              course: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [code, discountPercent, maxUses]

    SubscriptionPlan:
      type: object
      properties:
        _id: { type: string }
        duration: { type: string, enum: [1month, 3month, 6month] }
        price: { type: number }
        updatedAt: { type: string, format: date-time }
      required: [duration, price]

    Payment:
      type: object
      properties:
        user: { type: string }
        course: { type: string }
        subscriptionPlan: { type: string }
        amount: { type: number }
        authority: { type: string }
        refId: { type: string }
        status: { type: string, enum: [pending, completed, failed] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [user, amount, authority, status]

    VideoAccess:
      type: object
      properties:
        message: { type: string }
        video:
          type: object
          properties:
            title: { type: string }
            description: { type: string }
            duration: { type: number }
            time: { type: string }
            streamingLink: { type: string }
            downloadLink: { type: string }
      required: [message, video]

    #-------------------------
    # -------------------------------------------------
    # PAYMENT HISTORY
    # -------------------------------------------------
    PaymentHistoryItem:
      type: object
      properties:
        paymentId:
          type: string
          description: شناسه پرداخت
        amount:
          type: number
          description: مبلغ کل
        status:
          type: string
          enum: [pending, completed, failed]
        refId:
          type: string
          nullable: true
          description: شماره پیگیری بانک
        createdAt:
          type: string
          format: date-time
        itemsCount:
          type: integer
          description: تعداد آیتم‌ها (دوره + اشتراک)
        items:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [course, subscription]
              title:
                type: string
              coverImage:
                type: string
                format: uri
                nullable: true
              id:
                type: string
            required: [type, title, id]
        user:
          type: object
          nullable: true
          description: فقط برای ادمین
          properties:
            id: { type: string }
            name: { type: string }
            phone: { type: string }
            email: { type: string }
      required: [paymentId, amount, status, createdAt, itemsCount, items]

    # -------------------------------------------------
    # USER DASHBOARD (به‌روز شده)
    # -------------------------------------------------
    UserDashboardResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            _id: { type: string }
            name: { type: string }
           
            phone: { type: string }
            email: { type: string }
            role: { type: string }
            status: { type: string }
            subscription: { type: string }
            subscriptionExpiresAt: { type: string, format: date-time }
            profilePic: { type: string, format: uri, nullable: true }
            coursesEnrolledCount: { type: integer }
            commentsCount: { type: integer }
        enrolledCourses:
          type: array
          items:
            type: object
            properties:
              course:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string }
                  description: { type: string }
                  coverImage: { type: string, format: uri, nullable: true }
                  level: { type: string }
                  duration: { type: number }
                  type: { type: string }
                  price: { type: number }
                  discount: { type: number }
                  finalPrice: { type: number }
                  isDiscountActive: { type: boolean }
                  previewVideoUrl: { type: string, format: uri, nullable: true }
                  presentationMethod: { type: string }
                  chaptersCount: { type: integer }
                  studentCount: { type: integer }
                  createdAt: { type: string, format: date-time }
              teacher:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  expertise: { type: string }
                  bio: { type: string }
                  profilePic: { type: string, format: uri, nullable: true }
        comments:
          type: array
          items:
            type: object
            properties:
              commentId: { type: string }
              text: { type: string }
              rating: { type: number }
              status: { type: string }
              createdAt: { type: string, format: date-time }
              courseId: { type: string }
              courseTitle: { type: string }
        notifications:
          type: array
          items:
            type: object
            properties:
              _id: { type: string }
              title: { type: string }
              message: { type: string }
              type: { type: string }
              relatedId: { type: string }
              isRead: { type: boolean }
              createdAt: { type: string, format: date-time }
        paymentHistory:
          type: array
          items: { $ref: '#/components/schemas/PaymentHistoryItem' }
      required: [user, enrolledCourses, comments, notifications, paymentHistory]


    #-------------
    SearchSuggestion:
          allOf:
            - $ref: '#/components/schemas/Course'
            - type: object
              properties:
                teacherName:
                  type: string
                teacherRating:
                  type: number
                studentCount:
                  type: integer
                expertise:
                  type: string
                isDiscountActive:
                  type: boolean
                finalPrice:
                  type: number
                coverImage:
                  type: string
                  format: uri
                previewVideoUrl:
                  type: string
                  format: uri
                  nullable: true
                firstVideo:
                  type: object
                  nullable: true
                  properties:
                    _id:
                      type: string
                    title:
                      type: string
                    fileUrl:
                      type: string
                      format: uri
                    accessible:
                      type: boolean
              required:
                - _id
                - title
                - teacherName
                - coverImage



    #-------------------------

  responses:
      Unauthorized:
        description: Invalid or missing token
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      Forbidden:
        description: Admin access required
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      BadRequest:
        description: Invalid input
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      NotFound:
        description: Resource not found
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }
      ServerError:
        description: Internal server error
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Error' }

# ==============================================================
# ===========================  PATHS  ==========================
# ==============================================================

paths:
  # -------------------  AUTH  -------------------
  /auth/start:
    post:
      summary: Send OTP (login / registration start)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
              required: [phone]
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OTPResponse' }
        '400':
          description: Phone required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Rate limit exceeded for OTP request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/verify:
    post:
      summary: Verify OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string }
                otp: { type: string }
              required: [phone, otp]
      responses:
        '200':
          description: >-
            Existing user → login tokens  
            New user → tempUserId + requiresCompletion:true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyOTPResponse' }
        '400':
          description: Invalid or expired OTP
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/complete:
    post:
      summary: Complete registration (new users only)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tempUserId: { type: string }
                name: { type: string }
               
                email: { type: string }
                birthdate: { type: string, format: date }
                city: { type: string }
                address: { type: string }
                profilePic: { type: string }
              required: [tempUserId, name,  email]
      responses:
        '201':
          description: Registration finished → tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }
        '400':
          description: Invalid session / missing fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
              required: [refreshToken]
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
        '401':
          description: No refresh token provided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Invalid refresh token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }


  #----------------
  # ------------------- PODCASTS -------------------
  /podcasts:
    get:
      summary: Get all published podcasts
      description: Returns all published podcasts sorted by episode (descending). Audio is external URL, cover is uploaded.
      tags: [Podcasts]
      responses:
        '200':
          description: List of podcasts with full URLs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Podcast' }
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      summary: Create a new podcast (Admin only)
      description: >-
        Upload **cover image only**.  
        **Audio file is NOT uploaded** — provide `audioUrl` as a **valid HTTPS link** (e.g. CDN, YouTube, SoundCloud).  
        Admin only.
      tags: [Podcasts, Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - duration
                - episode
                - audioUrl
                - coverImage
              properties:
                title:
                  type: string
                  example: "JavaScript Fundamentals"
                description:
                  type: string
                  example: "Introduction to modern JavaScript concepts."
                  nullable: true
                duration:
                  type: integer
                  example: 45
                  description: Duration in minutes
                episode:
                  type: integer
                  example: 1
                  description: Episode number (unique per series)
                tags:
                  type: string
                  example: "javascript,beginner,programming"
                  description: Comma-separated tags (no JSON)
                audioUrl:
                  type: string
                  format: uri
                  example: "https://cdn.example.com/podcasts/ep1.mp3"
                  description: >-
                    **External audio URL** (must start with http:// or https://).  
                    File is **not uploaded**.
                coverImage:
                  type: string
                  format: binary
                  description: Cover image (JPG/PNG, max 5MB)
      responses:
        '201':
          description: Podcast created with full URLs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Podcast' }
        '400':
          description: Missing fields, invalid URL, or wrong file type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /podcasts/{id}:
    delete:
      summary: Delete a podcast (Admin only)
      description: >-
        Deletes podcast, its **cover image**, and related notifications.  
        **Audio file is NOT deleted** (external link).
      tags: [Podcasts, Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Podcast and cover image deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'


  /notifications:
      get:
        summary: Get user notifications
        description: Returns all notifications with unread count.
        tags: [Notifications]
        security:
          - BearerAuth: []
        responses:
          '200':
            description: Notifications with unread count
            content:
              application/json:
                schema: { $ref: '#/components/schemas/NotificationsResponse' }
          '401':
            $ref: '#/components/responses/Unauthorized'

      put:
        summary: Mark all notifications as read
        tags: [Notifications]
        security:
          - BearerAuth: []
        responses:
          '200':
            description: All notifications marked as read
            content:
              application/json:
                schema: { $ref: '#/components/schemas/SuccessMessage' }

  /notifications/read/{notificationId}:
    put:
      summary: Mark a single notification as read
      tags: [Notifications]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NotificationIdParam'
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessage' }
  # -------------------  USERS  -------------------
  /users/students:
    get:
      summary: Get all students by admin
      tags: [Users, Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    _id: { type: string }
                    name: { type: string }
                    
                    phone: { type: string }
                    email: { type: string }
                    createdAt: { type: string, format: date-time }
                    status: { type: string }
                    subscription: { type: string }
                    subscriptionExpiresAt: { type: string, format: date-time }
