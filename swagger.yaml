  # -------------------  COURSES  -------------------
  /courses:
    get:
      summary: Get all courses with optional status filter
      tags: [Courses]
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, pending, pre-register]
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Course'
                    - type: object
                      properties:
                        teacherName: { type: string }
                        studentCount: { type: integer }
                        chapters:
                          type: array
                          items:
                            type: object
                            properties:
                              videos:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    videoUrl: { type: string, format: uri }
        '500': { $ref: '#/components/responses/ServerError' }
    #-----------------
    post:
      summary: Create a new course (Admin only)
      description: |
        Full control over status + smart auto-detection for "last-week" and "sold-out".
        Only cover image is uploaded — videos use external URLs.
      tags: [Courses, Admin]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - coverImage
                - title
                - category
                - teacher
                - status
                - level
                - duration
                - presentationMethod
                - type
              properties:
                coverImage:
                  type: string
                  format: binary
                  description: Course cover image (JPG/PNG, max 5MB)
                title:
                  type: string
                  example: "Advanced Node.js & Express"
                description:
                  type: string
                  nullable: true
                category:
                  type: string
                  example: "68c7d1fef7b0c1ac54f81867"
                teacher:
                  type: string
                  example: "68c714e997d61d7fad8c1469"
                status:
                  type: string
                  enum: [pre-register, last-week, active, finished, sold-out]
                  description: |
                    Main status — fully controlled by admin.
                    This value will be used as displayStatus unless auto-rules override it.
                  example: active
                registrationEnd:
                  type: string
                  format: date-time
                  nullable: true
                  description: |
                     registration deadline.
                    
                  example: "2025-12-20T23:59:59Z"
                soldOutOverride:
                  type: boolean
                  default: false
                  description: |
                    Force "sold-out" status even if capacity remain.
                  example: true
                level:
                  type: string
                  enum: [مقدماتی, متوسط, پیشرفته]
                duration:
                  type: integer
                  example: 2400
                presentationMethod:
                  type: string
                  enum: [پخش آنلاین, قابلیت دریافت]
                type:
                  type: string
                  enum: [free, vip, paid]
                price:
                  type: number
                  example: 3200000
                capacity:
                  type: integer
                  minimum: 0
                  default: 0
                  example: 80
                discount:
                  type: number
                  default: 0
                  example: 15
                previewVideo:
                  type: string
                  format: uri
                  nullable: true
                # Chapters & videos (same structure as before)
                chapters[0].title:
                  type: string
                  example: "Introduction to Node.js"
                # ... rest unchanged

      responses:
        '201':
          description: Course created successfully with smart displayStatus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    #---------------
  /courses/{id}:
    put:
      summary: Update course (Admin only)
      tags: [Courses, Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                coverImage: { type: string, format: binary }
                title: { type: string }
                description: {type: string}
                category: { type: string }
                teacher: { type: string }
                status: { type: string }
                level: { type: string }
                capacity:
                  type: integer
                  minimum: 0
                  example: 150

                duration: { type: integer }
                presentationMethod: { type: string }
                type: { type: string }
                price: { type: integer }
                discount: { type: integer }
                discountHours: { type: integer }
                discountMinutes: { type: integer }
                discountSeconds: { type: integer }
                previewVideoUrl: { type: string, format: uri }
                chapters[0].title: { type: string }
                chapters[0].videos[0].videoUrl: { type: string, format: uri }
      responses:
        '200': { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

    delete:
      summary: Delete course
      tags: [Courses, Admin]
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Course and cover image deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  /course/{courseId}/detail:
    get:
      summary: Get detailed course with access control
      tags: [Courses]
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
      responses:
        '200':
          description: Full course detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  userProfile: { $ref: '#/components/schemas/User' }
                  notifications: { $ref: '#/components/schemas/NotificationsResponse' }
                  basket:
                    type: object
                    properties:
                      itemCount: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            courseId: { type: string }
                            title: { type: string }
                            price: { type: number }
                            discount: { type: number }
                            finalPrice: { type: number }
                      subscriptionPlan: { type: object, nullable: true }
                  course:
                    allOf:
                      - $ref: '#/components/schemas/Course'
                      - type: object
                        properties:
                          teacherName: { type: string }
                          isEnrolled: { type: boolean }
                          canAccess: { type: boolean }
                          chapters:
                            type: array
                            items:
                              type: object
                              properties:
                                videos:
                                  type: array
                                  items: { $ref: '#/components/schemas/VideoAccessInfo' }
                  teacher:
                    type: object
                    properties:
                      _id: { type: string }
                      name: { type: string }
                      expertise: { type: string }
                      bio: { type: string }
                      rating: { type: number }
                  relatedCourses:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        title: { type: string }
                        coverImage: { type: string, format: uri }
                        finalPrice: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }

  #---------------------
  /courses/filter:
    get:
      summary: get courses with filters 
      description: |
        API حرفه‌ای برای فیلتر دوره‌ها با قابلیت‌های:
        - جستجو در عنوان و توضیحات
        - فیلتر بر اساس رایگان/پولی/VIP
        - فقط دوره‌های در حال تخفیف
        - فیلتر نوع دوره (free, vip , paid)
        - فیلتر دسته‌بندی (frontend, backend, ...)
        - مرتب‌سازی (جدیدترین، محبوب‌ترین، پرفروش‌ترین، قیمت)
        - صفحه‌بندی کامل
      tags: [Courses]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: جستجو در عنوان و توضیحات دوره
          example: react

        - in: query
          name: sort
          schema:
            type: string
            enum: [newest, popular, bestselling, price_asc, price_desc]
            default: newest
          description: مرتب‌سازی نتایج

        - in: query
          name: freeCourse
          schema:
            type: string
            enum: ['true', 'false']
          description: فقط دوره‌های رایگان یا فقط غیررایگان

        - in: query
          name: onlyDiscount
          schema:
            type: string
            enum: ['true', 'false']
          description: فقط دوره‌هایی که هم‌اکنون در حال تخفیف هستند

        - in: query
          name: type
          schema:
            type: string
          description: فیلتر نوع دوره (چندتایی با کاما جدا شده)
          example: react,nextjs,nodejs

        - in: query
          name: category
          schema:
            type: string
          description: فیلتر دسته‌بندی (بر اساس slug، چندتایی با کاما)
          example: frontend,backend,mobile

        - in: query
          name: level
          schema:
            type: string
            enum: [مقدماتی, متوسط, پیشرفته]
          description: سطح دوره

        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: شماره صفحه

        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
          description: تعداد آیتم در هر صفحه

      responses:
        '200':
          description: لیست فیلترشده دوره‌ها با صفحه‌بندی و فیلترهای اعمال‌شده
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        slug:
                          type: string
                          nullable: true
                        description:
                          type: string
                          nullable: true
                        coverImage:
                          type: string
                          format: uri
                        previewVideoUrl:
                          type: string
                          format: uri
                          nullable: true
                        price:
                          type: number
                        discount:
                          type: number
                        discountEnd:
                          type: string
                          format: date-time
                          nullable: true
                        finalPrice:
                          type: number
                        isDiscountActive:
                          type: boolean
                        type:
                          type: string
                          enum: [free, vip, paid]
                        level:
                          type: string
                          enum: [مقدماتی, متوسط, پیشرفته]
                        duration:
                          type: integer
                        studentCount:
                          type: integer
                        chapterCount:
                          type: integer
                        videoCount:
                          type: integer
                        teacher:
                          type: object
                          properties:
                            name:
                              type: string
                            expertise:
                              type: string
                              nullable: true
                            rating:
                              type: number
                            profilePic:
                              type: string
                              format: uri
                              nullable: true
                        category:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              slug:
                                type: string
                        createdAt:
                          type: string
                          format: date-time
                        isEnrolled:
                          type: boolean
                          description: آیا کاربر لاگین‌کرده این دوره را خریده (اگر لاگین نباشد false)
                      required:
                        - id
                        - title
                        - coverImage
                        - price
                        - finalPrice
                        - type
                        - studentCount

                  pagination:
                    type: object
                    properties:
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      totalCourses:
                        type: integer
                      hasNext:
                        type: boolean
                      hasPrev:
                        type: boolean
                    required:
                      - currentPage
                      - totalPages
                      - totalCourses

                  filters:
                    type: object
                    description: فیلترهای اعمال‌شده (برای نمایش در فرانت‌اند)
                    properties:
                      sort: { type: string }
                      search: { type: string, nullable: true }
                      freeCourse: { type: string, nullable: true }
                      onlyDiscount: { type: string, nullable: true }
                      type: { type: array, items: { type: string } }
                      category: { type: array, items: { type: string } }
                      level: { type: string, nullable: true }

                required: [courses, pagination, filters]

        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'


  # ------------------- COURSE SEARCH (AUTOCOMPLETE) -------------------
  /courses/search:
    get:
      summary: Course search & autocomplete
      description: |
        Returns up to 5 active courses matching the query on **title**, **teacher**, or **category**.
        Each result includes **full course data** (same as detail page) for direct navigation.
      tags: [Courses]
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
            minLength: 2
          required: true
          description: Search term (min 2 chars)
          example: react
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    maxItems: 5
                    items:
                      $ref: '#/components/schemas/SearchSuggestion'
                required: [suggestions]
        '400':
          description: Query too short
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

