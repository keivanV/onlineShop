  # -------------------  HOMEPAGE  -------------------
  /homepage:
    get:
      summary: Get homepage data with statistics and paginated courses
      tags: [Homepage]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 3 }
        - in: query
          name: status
          schema: { type: string, enum: ['active', 'pending', 'pre-register'] }
        - in: query
          name: category
          schema: { type: string }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  statistics:
                    type: object
                    properties:
                      totalCourses: { type: integer }
                      completedCourses: { type: integer }
                      ongoingCourses: { type: integer }
                      totalStudents: { type: integer }
                      latestCourseTime: { type: string }
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        coverImage: { type: string }
                        teacher: { type: string }
                        expertise: { type: string }
                        price: { type: number }
                        status: { type: string }
                        level: { type: string }
                        duration: { type: number }
                        type: { type: string }
                        category: { type: string }
                        createdAt: { type: string, format: date-time }
                  pagination:
                    type: object
                    properties:
                      currentPage: { type: integer }
                      totalPages: { type: integer }
                      totalCourses: { type: integer }
                      limit: { type: integer }
                  canCreateCourse: { type: boolean }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # -------------------  BASKET  -------------------
  /basket:
    get:
      summary: Get user's shopping cart
      tags: [Basket]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { type: string }
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        courseId: { type: string }
                        title: { type: string }
                        originalPrice: { type: number }
                        courseDiscountPercent: { type: number }
                        courseDiscountAmount: { type: number }
                        codeDiscountAmount: { type: number }
                        finalPrice: { type: number }
                        discountCode: { type: string, nullable: true }
                  subscriptionPlan:
                    type: object
                    nullable: true
                    properties:
                      subscriptionPlanId: { type: string }
                      duration: { type: string }
                      price: { type: number }
                  totalPrice: { type: number }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    post:
      summary: Add item to shopping cart
      tags: [Basket]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId: { type: string }
                subscriptionPlanId: { type: string }
                discountCode: { type: string }
              oneOf:
                - required: [courseId]
                - required: [subscriptionPlanId]
      responses:
        '200':
          description: Item added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  basket: { type: object }
        '400':
          description: Invalid input or item already in basket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Course, subscription plan, or discount code not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

    delete:
      summary: Remove item from shopping cart
      tags: [Basket]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                courseId: { type: string }
                subscriptionPlanId: { type: string }
              oneOf:
                - required: [courseId]
                - required: [subscriptionPlanId]
      responses:
        '200':
          description: Item removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  basket: { type: object }
        '400':
          description: Invalid input or item not in basket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Basket or item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /basket/checkout:
    post:
      summary: Checkout all items in the shopping cart
      tags: [Basket]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Payment created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  paymentUrl: { type: string }
                  authority: { type: string }
                  paymentId: { type: string }
                  totalPrice: { type: number }
                  paymentRequired: { type: boolean }
        '400':
          description: Basket is empty or invalid items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: User or basket not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Server error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

